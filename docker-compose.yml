# Local backend: Postgres + Nakama with the Chkobba runtime module.
# Build the module first (`pnpm --filter @chkobba/server build`); it is mounted, so
# rebuilding and restarting Nakama (`docker compose restart nakama`) picks up changes.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'nakama']
      interval: 3s
      timeout: 3s
      retries: 20

  nakama:
    image: heroiclabs/nakama:3.40.0
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ecx
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama --config /nakama/data/local.yml --database.address postgres:localdb@postgres:5432/nakama
    volumes:
      - ./apps/server/local.yml:/nakama/data/local.yml:ro
      - ./apps/server/build:/nakama/data/modules/build:ro
    ports:
      - '7349:7349'
      - '7350:7350'
      - '7351:7351'
    restart: unless-stopped

volumes:
  pgdata:
