name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Expo and jest-expo are only tested on LTS Node; stay off odd/current releases.
  NODE_VERSION: '24'
  CI: 'true'

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `apps/mobile` typechecks against generated files that are gitignored
      # (`expo-env.d.ts`, `.expo/types/router.d.ts`). `expo customize` runs the
      # type-generation step without starting a dev server.
      - name: Generate Expo types
        working-directory: apps/mobile
        run: npx expo customize tsconfig.json

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Builds the ES5 Nakama module (rollup → apps/server/build) and the mobile bundle.
      - name: Build
        run: pnpm build

      # Bundles the web app through Metro, which catches resolution errors that
      # typechecking and jest both miss.
      - name: Bundle web
        working-directory: apps/mobile
        run: npx expo export --platform web --output-dir /tmp/web-export
